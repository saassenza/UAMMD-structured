name: uammd-structured
channels:
  - conda-forge
dependencies:
  - cmake >=3.27
  - cuda-version
  - gxx 11.*
  - gcc
  - cuda-libraries-dev
  - cuda-nvcc
  - make
  - ninja
  - libblas
  - liblapacke
  - blas-devel
  - pybind11
  - python >=3,<3.15   # CMake 4.5 FindPython does not find Python 3.15 yet
  - pip
  - numpy
  - tqdm
